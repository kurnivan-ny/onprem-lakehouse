# Monitoring: Prometheus + Grafana (+ Kafka exporter).   profile: monitoring
# Scrapes whatever is running; targets of profiles that are off simply show as DOWN.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:12.1.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    profiles: [monitoring]
    command: ["--kafka.server=kafka:9092"]
    restart: unless-stopped        # retries until the event profile's Kafka is up

volumes:
  prometheus-data:
  grafana-data:
