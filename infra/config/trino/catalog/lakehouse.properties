# All Iceberg tables (batch + event) via Lakekeeper; data read directly from RustFS.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=${ENV:ICEBERG_WAREHOUSE}

fs.native-s3.enabled=true
s3.endpoint=http://rustfs:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:RUSTFS_ACCESS_KEY}
s3.aws-secret-key=${ENV:RUSTFS_SECRET_KEY}
