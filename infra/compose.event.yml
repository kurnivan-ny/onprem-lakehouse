# Event: producer -> Kafka (KRaft) -> Flink SQL -> Iceberg bronze/silver/gold + DLQ topic.   profile: event

x-flink-env: &flink-env
  RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
  RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
  ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
  TOPIC_EVENTS: ${TOPIC_EVENTS}
  TOPIC_DLQ: ${TOPIC_DLQ}
  AWS_REGION: us-east-1
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: flink-jobmanager
    rest.address: flink-jobmanager
    taskmanager.numberOfTaskSlots: 4
    parallelism.default: 1
    jobmanager.memory.process.size: 1024m
    taskmanager.memory.process.size: 2048m
    state.backend.type: hashmap
    state.checkpoints.dir: file:///opt/flink/checkpoints
    execution.checkpointing.interval: 30s
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: 9249
    classloader.check-leaked-classloader: false

x-flink: &flink
  profiles: [event]
  build:
    context: ..
    dockerfile: infra/images/flink/Dockerfile
  image: onprem-lakehouse/flink:local
  environment: *flink-env
  volumes:
    - flink-checkpoints:/opt/flink/checkpoints

services:
  kafka:
    image: apache/kafka:3.9.1
    profiles: [event]
    ports:
      - "29092:29092"   # clients on your host: localhost:29092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    # Topic data lives in the container (survives stop/start, not `down`).
    # Kafka is the buffer; the durable copy is bronze in Iceberg.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.1
    profiles: [event]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in ${TOPIC_EVENTS}:3 ${TOPIC_DLQ}:1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$${t%%:*}" --partitions "$${t##*:}" --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    profiles: [event]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: onprem
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  flink-jobmanager:
    <<: *flink
    command: ["jobmanager"]
    ports:
      - "8081:8081"   # Flink UI
    restart: unless-stopped

  flink-taskmanager:
    <<: *flink
    command: ["taskmanager"]
    depends_on:
      flink-jobmanager:
        condition: service_started
    restart: unless-stopped

  # One-shot: submits the Flink SQL pipeline if it is not already running.
  flink-sql-runner:
    <<: *flink
    command: ["/opt/flink/jobs/submit.sh"]
    volumes: []
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      platform-init:
        condition: service_completed_successfully
    restart: "no"

  event-producer:
    profiles: [event]
    build:
      context: ..
      dockerfile: pipelines/event/producer/Dockerfile
    image: onprem-lakehouse/event-producer:local
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC_EVENTS: ${TOPIC_EVENTS}
      EVENTS_PER_SEC: ${EVENTS_PER_SEC}
      BAD_EVENT_RATE: ${BAD_EVENT_RATE}
      DUPLICATE_RATE: ${DUPLICATE_RATE}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  flink-checkpoints:
