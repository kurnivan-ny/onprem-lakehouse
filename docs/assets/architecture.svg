  <path d="M330,290 L366,290" class="ln" marker-end="url(#a)"/>
  <rect x="366" y="260" width="160" height="60" rx="8" class="box e"/>
  <text x="446.0" y="286.0" class="t" text-anchor="middle">Flink 1.20 SQL</text>
