  <rect x="200" y="370" width="130" height="50" rx="8" class="box r"/>
  <text x="265.0" y="391.0" class="t" text-anchor="middle">orders.dlq</text>
  <text x="265.0" y="408.0" class="s" text-anchor="middle">invalid + reason</text>
  <rect x="574" y="74" width="100" height="22" rx="11.0" class="pb"/>
  <text x="624.0" y="89.0" class="h xb" text-anchor="middle">BRONZE</text>
