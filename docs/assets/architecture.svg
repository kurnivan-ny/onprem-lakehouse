  <path d="M792,160 L810,160" class="ln" marker-end="url(#a)"/>
  <path d="M674,290 L692,290" class="ln" marker-end="url(#a)"/>
  <path d="M792,290 L810,290" class="ln" marker-end="url(#a)"/>
