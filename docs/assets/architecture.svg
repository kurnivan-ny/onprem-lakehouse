  <text x="1014.0" y="221.0" class="t" text-anchor="middle">Trino</text>
  <text x="1014.0" y="238.0" class="s" text-anchor="middle">SQL on every table</text>
  <path d="M1014,255 L1014,290" class="ln" marker-end="url(#a)"/>
  <rect x="948" y="290" width="132" height="60" rx="8" class="box"/>
