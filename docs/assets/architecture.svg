  <rect x="24" y="464" width="202" height="56" rx="8" class="box"/>
  <text x="38" y="487" class="t" text-anchor="start">Dagster</text>
  <text x="38" y="505" class="s" text-anchor="start">schedules + maintenance</text>
  <rect x="236" y="464" width="202" height="56" rx="8" class="box"/>
  <text x="250" y="487" class="t" text-anchor="start">Prometheus + Grafana</text>
  <text x="250" y="505" class="s" text-anchor="start">Kafka lag · checkpoints</text>
  <rect x="448" y="464" width="202" height="56" rx="8" class="box"/>
  <text x="462" y="487" class="t" text-anchor="start">OpenMetadata</text>
  <text x="462" y="505" class="s" text-anchor="start">catalog · lineage</text>
  <rect x="660" y="464" width="202" height="56" rx="8" class="box"/>
  <text x="674" y="487" class="t" text-anchor="start">JSON Schema contract</text>
