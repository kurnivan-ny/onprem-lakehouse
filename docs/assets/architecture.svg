  <rect x="810" y="74" width="100" height="22" rx="11.0" class="pg"/>
  <text x="860.0" y="89.0" class="h xg" text-anchor="middle">GOLD</text>
  <rect x="574" y="130" width="100" height="60" rx="8" class="box b"/>
  <text x="624.0" y="156.0" class="t" text-anchor="middle">append</text>
  <text x="624.0" y="173.0" class="s" text-anchor="middle">raw + audit</text>
  <rect x="692" y="130" width="100" height="60" rx="8" class="box b"/>
  <text x="742.0" y="156.0" class="t" text-anchor="middle">MERGE</text>
  <text x="742.0" y="173.0" class="s" text-anchor="middle">after DQ gate</text>
  <rect x="810" y="130" width="100" height="60" rx="8" class="box b"/>
  <text x="860.0" y="156.0" class="t" text-anchor="middle">rebuild</text>
  <text x="860.0" y="173.0" class="s" text-anchor="middle">daily marts</text>
  <rect x="574" y="260" width="100" height="60" rx="8" class="box e"/>
  <text x="624.0" y="286.0" class="t" text-anchor="middle">append</text>
  <text x="624.0" y="303.0" class="s" text-anchor="middle">raw text</text>
  <rect x="692" y="260" width="100" height="60" rx="8" class="box e"/>
  <text x="742.0" y="286.0" class="t" text-anchor="middle">upsert</text>
  <text x="742.0" y="303.0" class="s" text-anchor="middle">dedup by id</text>
  <rect x="810" y="260" width="100" height="60" rx="8" class="box e"/>
  <text x="860.0" y="286.0" class="t" text-anchor="middle">upsert</text>
