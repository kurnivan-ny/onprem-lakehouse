  <text x="1014" y="40" class="h" text-anchor="middle">SERVE</text>
  <text x="24" y="120" class="h tb" text-anchor="start">BATCH · DAILY 01:00</text>
  <text x="24" y="250" class="h te" text-anchor="start">EVENT · CONTINUOUS</text>
  <rect x="560" y="58" width="364" height="362" rx="8" class="card"/>
  <rect x="24" y="130" width="140" height="60" rx="8" class="box b"/>
  <text x="94.0" y="156.0" class="t" text-anchor="middle">Postgres 16</text>
  <text x="94.0" y="173.0" class="s" text-anchor="middle">sales.* (OLTP)</text>
  <path d="M164,160 L366,160" class="ln" marker-end="url(#a)"/>
  <text x="265" y="152" class="s" text-anchor="middle">JDBC, incremental</text>
  <text x="265" y="177" class="mm" text-anchor="middle">updated_at &gt; watermark</text>
  <rect x="366" y="130" width="160" height="60" rx="8" class="box b"/>
  <text x="446.0" y="156.0" class="t" text-anchor="middle">Spark 3.5</text>
  <text x="446.0" y="173.0" class="s" text-anchor="middle">via Spark Connect</text>
  <path d="M526,160 L574,160" class="ln" marker-end="url(#a)"/>
  <rect x="24" y="260" width="140" height="60" rx="8" class="box e"/>
  <text x="94.0" y="286.0" class="t" text-anchor="middle">Order app</text>
  <text x="94.0" y="303.0" class="s" text-anchor="middle">event producer</text>
  <path d="M164,290 L200,290" class="ln" marker-end="url(#a)"/>
