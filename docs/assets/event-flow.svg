<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Event pipeline: one Flink SQL job, five sinks</title>
  <desc id="desc">Order events flow from the producer into Kafka and one Flink SQL job, which writes raw records to bronze, validated events to silver, two gold tables, and invalid events to the orders.dlq topic.</desc>
  <style>
.bg{fill:#ffffff;stroke:#d0d7de}
.box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.zone{fill:none;stroke:#afb8c1;stroke-width:1;stroke-dasharray:5 4}
.b{stroke:#0969da}.e{stroke:#8250df}.r{stroke:#cf222e}.g{stroke:#1a7f37}.o{stroke:#bc4c00}.n{stroke:#6e7781}
.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;font-weight:600;fill:#1f2328}
.tl{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;font-weight:700;fill:#1f2328}
.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11.5px;fill:#59636e}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:11px;fill:#1f2328}
.mm{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:11px;fill:#59636e}
.h{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:1px;fill:#59636e}
.ln{fill:none;stroke:#8c959f;stroke-width:1.5}
.lr{fill:none;stroke:#cf222e;stroke-width:1.5;stroke-dasharray:5 3}
.ah{fill:#8c959f}.ar{fill:#cf222e}
.tb{fill:#0969da}.te{fill:#8250df}.tr{fill:#cf222e}.tg{fill:#1a7f37}.to{fill:#bc4c00}.tn{fill:#6e7781}
.fb{fill:#0969da}.fe{fill:#8250df}.fr{fill:#cf222e}.fg{fill:#1a7f37}.fo{fill:#bc4c00}.fn{fill:#6e7781}
.pb{fill:#b4690e;fill-opacity:.12;stroke:#b4690e}.xb{fill:#8f5209}
.ps{fill:#6e7781;fill-opacity:.12;stroke:#6e7781}.xs{fill:#57606a}
.pg{fill:#bf8700;fill-opacity:.14;stroke:#bf8700}.xg{fill:#7d5700}
.pr{fill:#cf222e;fill-opacity:.10;stroke:#cf222e}
.dot{fill:#ffffff;stroke:#8c959f;stroke-width:2}
.dotc{fill:#1a7f37;stroke:#1a7f37;stroke-width:2}
.lbl{fill:#ffffff}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117;stroke:#30363d}
.box{fill:#161b22;stroke:#30363d}
.card{fill:#0d1117;stroke:#30363d}
.zone{stroke:#484f58}
.b{stroke:#4493f8}.e{stroke:#ab7df8}.r{stroke:#f85149}.g{stroke:#3fb950}.o{stroke:#f0883e}.n{stroke:#9198a1}
.t,.tl,.m{fill:#e6edf3}
.s,.mm,.h{fill:#9198a1}
.ln{stroke:#656c76}.ah{fill:#656c76}
.lr{stroke:#f85149}.ar{fill:#f85149}
.tb{fill:#4493f8}.te{fill:#ab7df8}.tr{fill:#f85149}.tg{fill:#3fb950}.to{fill:#f0883e}.tn{fill:#9198a1}
.fb{fill:#4493f8}.fe{fill:#ab7df8}.fr{fill:#f85149}.fg{fill:#3fb950}.fo{fill:#f0883e}.fn{fill:#9198a1}
.pb{fill:#d18f52;stroke:#d18f52}.xb{fill:#e0a370}
.ps{fill:#9198a1;stroke:#9198a1}.xs{fill:#c9d1d9}
.pg{fill:#e3b341;stroke:#e3b341}.xg{fill:#e3b341}
.pr{fill:#f85149;stroke:#f85149}
.dot{fill:#0d1117;stroke:#656c76}
.dotc{fill:#3fb950;stroke:#3fb950}
.lbl{fill:#0d1117}
}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ar"/></marker></defs>
  <rect x="0.5" y="0.5" width="999" height="359" rx="12" class="bg"/>
  <rect x="24" y="150" width="130" height="60" rx="8" class="box e"/>
  <text x="89.0" y="176.0" class="t" text-anchor="middle">Order app</text>
  <text x="89.0" y="193.0" class="s" text-anchor="middle">producer</text>
  <path d="M154,180 L184,180" class="ln" marker-end="url(#a)"/>
  <rect x="184" y="150" width="140" height="60" rx="8" class="box e"/>
  <text x="254.0" y="176.0" class="t" text-anchor="middle">Kafka</text>
  <text x="254.0" y="193.0" class="mm" text-anchor="middle">orders.events</text>
  <path d="M324,180 L360,180" class="ln" marker-end="url(#a)"/>
  <rect x="360" y="104" width="212" height="152" rx="8" class="box e"/>
  <text x="376" y="130" class="t" text-anchor="start">Flink SQL job</text>
  <text x="376" y="156" class="s" text-anchor="start">1 · read each record as text</text>
  <text x="376" y="176" class="s" text-anchor="start">2 · parse JSON, check contract</text>
  <text x="376" y="196" class="s" text-anchor="start">3 · route to 5 sinks</text>
  <text x="376" y="238" class="h te" text-anchor="start">CHECKPOINT EVERY 30 S</text>
  <rect x="620" y="24" width="356" height="52" rx="8" class="box"/>
  <rect x="632" y="39" width="64" height="22" rx="11.0" class="pb"/>
  <text x="664.0" y="54.0" class="h xb" text-anchor="middle">BRONZE</text>
  <text x="708" y="46" class="m" text-anchor="start">bronze.orders_events_raw</text>
  <text x="708" y="64" class="s" text-anchor="start">every record, raw text + Kafka offset</text>
  <path d="M572,180 C596,180 596,50 620,50" class="ln" marker-end="url(#a)"/>
  <rect x="620" y="88" width="356" height="52" rx="8" class="box"/>
  <rect x="632" y="103" width="64" height="22" rx="11.0" class="ps"/>
  <text x="664.0" y="118.0" class="h xs" text-anchor="middle">SILVER</text>
  <text x="708" y="110" class="m" text-anchor="start">silver.orders_events</text>
  <text x="708" y="128" class="s" text-anchor="start">valid events; upsert drops duplicates</text>
  <path d="M572,180 C596,180 596,114 620,114" class="ln" marker-end="url(#a)"/>
  <rect x="620" y="152" width="356" height="52" rx="8" class="box"/>
  <rect x="632" y="167" width="64" height="22" rx="11.0" class="pg"/>
  <text x="664.0" y="182.0" class="h xg" text-anchor="middle">GOLD</text>
  <text x="708" y="174" class="m" text-anchor="start">gold.orders_current_status</text>
  <text x="708" y="192" class="s" text-anchor="start">latest status per order</text>
  <path d="M572,180 C596,180 596,178 620,178" class="ln" marker-end="url(#a)"/>
  <rect x="620" y="216" width="356" height="52" rx="8" class="box"/>
  <rect x="632" y="231" width="64" height="22" rx="11.0" class="pg"/>
  <text x="664.0" y="246.0" class="h xg" text-anchor="middle">GOLD</text>
  <text x="708" y="238" class="m" text-anchor="start">gold.orders_revenue_per_minute</text>
  <text x="708" y="256" class="s" text-anchor="start">paid revenue per minute × country</text>
  <path d="M572,180 C596,180 596,242 620,242" class="ln" marker-end="url(#a)"/>
  <rect x="620" y="280" width="356" height="52" rx="8" class="box r"/>
  <rect x="632" y="295" width="64" height="22" rx="11.0" class="pr"/>
  <text x="664.0" y="310.0" class="h tr" text-anchor="middle">DLQ</text>
  <text x="708" y="302" class="m" text-anchor="start">kafka · orders.dlq</text>
  <text x="708" y="320" class="s" text-anchor="start">invalid events + error reason</text>
  <path d="M572,180 C596,180 596,306 620,306" class="lr" marker-end="url(#ar)"/>
  <rect x="24" y="286" width="548" height="54" rx="8" class="card"/>
  <text x="40" y="308" class="s" text-anchor="start">Crash-safe: if Flink stops, Kafka keeps buffering (7-day retention).</text>
  <text x="40" y="326" class="s" text-anchor="start">On restart it resumes from the last checkpoint; upserts absorb replays.</text>
</svg>
